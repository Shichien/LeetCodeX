name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@f1b61bf3a1373bccc1ebdc11506122709bd40dee # cargo-audit
      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Verify release metadata
        run: node scripts/check-release-version.mjs
      - name: Audit production dependencies
        run: |
          pnpm --dir web audit --prod --audit-level high
          cargo audit --deny warnings
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-release-version.mjs --tag "$GITHUB_REF_NAME"

  macos-universal:
    needs: verify-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy,rustfmt
      - name: Build universal macOS package
        run: bash scripts/build-macos-release.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Leetcodex-macos-universal
          path: |
            release/Leetcodex-*-macos-universal/
            release/Leetcodex-*-macos-universal.zip
            release/Leetcodex-*-macos-universal.zip.sha256
          if-no-files-found: error

  windows-x64:
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy,rustfmt
      - name: Build Windows package
        shell: pwsh
        run: ./scripts/build-windows-release.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Leetcodex-windows-x64
          path: |
            release/Leetcodex-*-windows-x64/
            release/Leetcodex-*-windows-x64.zip
            release/Leetcodex-*-windows-x64.zip.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-universal, windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Leetcodex-*
          path: release-artifacts
      - name: Verify and stage release assets
        run: |
          mkdir publish
          mapfile -d '' checksums < <(find release-artifacts -name '*.zip.sha256' -print0)
          test "${#checksums[@]}" -eq 2
          for checksum in "${checksums[@]}"; do
            directory="$(dirname "$checksum")"
            filename="$(basename "$checksum")"
            (cd "$directory" && sha256sum -c "$filename")
            cp "$checksum" publish/
            cp "${checksum%.sha256}" publish/
          done
          test "$(find publish -maxdepth 1 -name '*.zip' | wc -l)" -eq 2
          test "$(find publish -maxdepth 1 -name '*.zip.sha256' | wc -l)" -eq 2
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: publish/*.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" publish/* --generate-notes --verify-tag
