[package]
name = "leetcodex"
version = "0.2.64"
edition = "2024"
license = "MIT"
description = "Local algorithm practice injected into the Codex desktop composer"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
fs2 = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tungstenite = "0.28"
url = "2.5"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
